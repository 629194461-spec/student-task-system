services:
  learning-planet:
    build: .
    ports:
      - "4173:4173"
    env_file:
      - .env
    volumes:
      - learning-planet-data:/app/data
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: learning-planet-nginx
    restart: unless-stopped
    depends_on:
      - learning-planet
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  learning-planet-data:
